name: SAN task proposal
description: Propose routine shared work for trusted coordinator triage
labels:
  - status:intake
body:
  - type: markdown
    attributes:
      value: >-
        This form creates a proposal only. It does not assign an owner, grant
        authority, or authorize execution. A trusted coordinator must triage
        the proposal, an owner team must accept it, and authorized maintainers
        must apply any ready or authority labels before work may begin. GitHub
        is the shared public work ledger. Do not include credentials, private
        memory, confidential material, or owner-private context.
  - type: input
    id: objective
    attributes:
      label: Objective
      description: What observable result should exist when this is done?
    validations:
      required: true
  - type: dropdown
    id: suggested_team
    attributes:
      label: Suggested team (proposal only)
      description: This suggestion neither assigns nor authorizes a team. The team must explicitly accept ownership during trusted triage.
      options:
        - Coordinator triage requested
        - Sameer + Expert
        - Srini + Gideon
        - Harris + Gerri
        - Aneek + Nemertes
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: Success condition
      description: The evidence that will prove completion.
    validations:
      required: true
  - type: textarea
    id: next_action
    attributes:
      label: Proposed next action
      description: A proposed action for triage; it is not executable or assigned until an owner accepts it and trusted maintainers authorize the work.
    validations:
      required: true
  - type: textarea
    id: blockers
    attributes:
      label: Blockers or dependencies
      description: Write “None” when there are no blockers.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and artifacts
      description: Links to PRs, files, receipts, or test results. May be empty at creation.
  - type: checkboxes
    id: public_boundary
    attributes:
      label: Public boundary
      options:
        - label: This issue contains no secrets, private memory, confidential material, or owner-private context.
          required: true
